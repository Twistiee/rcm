; RCM firmware -- STM32F446RET6, 8MHz HSE crystal
;
[platformio]
; `pio run` with no -e must build only the board firmware. Without this it would also
; try to build src/ natively under the test environment, where half of it needs the
; STM32 HAL and none of it belongs.
default_envs = rcm

;
; Two environments:
;   rcm     the real thing, cross-compiled for the board
;   native  host unit tests. `pio test -e native`. Needs a host gcc on PATH --
;           MinGW-w64 (WinLibs) on Windows. The tests run the firmware's OWN source
;           files against a model of the board in test/stubs, so they are testing the
;           code that ships, not a transcription of it.
[env:rcm]
platform      = ststm32
board         = genericSTM32F446RE
framework     = arduino
; The ST-Link clone on this bench enumerates as 0483:3752 while running V2 firmware
; (V2J43M28). OpenOCD maps that PID to its DAP driver, but PlatformIO's stock stlink
; config hardcodes `transport select hla_swd`, which the DAP driver rejects outright:
;   "Debug adapter doesn't support 'hla_swd' transport"
; There is no PlatformIO knob for the transport, so upload and debug both drive OpenOCD
; directly with `transport select swd`. Use dfu with J_BOOT 1-2 jumpered instead if the
; probe is unavailable.
; The second trap is speed. target/stm32f4x.cfg bumps the adapter to 8MHz (negotiated
; down to 4MHz) for programming, and this probe silently corrupts flash writes there --
; erase succeeds, "Programming Finished" prints, and the chip reads back all 0xFF. Only
; the verify catches it. 480kHz is reliable; 128KiB takes about 6.5s. If you swap in a
; genuine probe you can raise it, and verify_image will tell you immediately if it lies.
upload_protocol = custom
upload_command  = ${platformio.packages_dir}/tool-openocd/bin/openocd -s ${platformio.packages_dir}/tool-openocd/openocd/scripts -f interface/stlink.cfg -c "transport select swd" -f target/stm32f4x.cfg -c init -c "reset halt" -c "adapter speed 480" -c "flash write_image erase {$BUILD_DIR/firmware.bin} 0x08000000 bin" -c "verify_image {$BUILD_DIR/firmware.bin} 0x08000000 bin" -c "reset run" -c shutdown
debug_tool    = custom
debug_server  =
    ${platformio.packages_dir}/tool-openocd/bin/openocd
    -s
    ${platformio.packages_dir}/tool-openocd/openocd/scripts
    -f
    interface/stlink.cfg
    -c
    transport select swd
    -f
    target/stm32f4x.cfg
monitor_speed = 115200
build_flags =
    -D HSE_VALUE=8000000U       ; Y1 is 8MHz -- wrong value here breaks CAN timing
    -D RCM_FW_VERSION=\"0.2.0\"
    ; The STM32duino core leaves bxCAN out of the HAL build by default (it is in the
    ; "unused modules" list in cores/arduino/stm32/stm32yyxx_hal_conf.h). Without this
    ; flag stm32f4xx_hal_can.c compiles to nothing and CAN_HandleTypeDef does not exist.
    -D HAL_CAN_MODULE_ENABLED
    ; newlib-nano leaves %f out of printf unless it is force-linked. Without this the
    ; conversion emits nothing AND fails to advance the varargs pointer, so the rest of
    ; the format string is parsed against the wrong arguments. Observed on real hardware
    ; during bring-up: the IMU readout desynced, handed memcpy a garbage length, dumped
    ; raw SRAM out the USB console and then bus-faulted off the top of RAM (BFAR =
    ; 0x20020000) into Default_Handler. It is only the selftest build that formats floats
    ; today, but this lives in the shared flags on purpose -- a %f added to the shipping
    ; firmware later must not be able to corrupt memory in a car. ~1.5KB of 512KB.
    -Wl,-u_printf_float
    -Wall
build_src_filter = +<*> -<selftest_main.cpp>
test_ignore = *              ; the native tests are not cross-compiled for the board

; Bring-up console on the USB-C port -- `pio run -e selftest -t upload`, then open the
; COM port it enumerates as. Swaps main.cpp for selftest_main.cpp, so the interactive
; build can never ship by accident. USB CDC is enabled ONLY here: it costs flash and it
; puts a second thing on the bus-powered rail, neither of which the car needs.
[env:selftest]
extends       = env:rcm
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env:rcm.build_flags}
    -D USBCON
    -D USBD_USE_CDC
    -D RCM_SELFTEST

[env:native]
platform      = native
test_framework = unity
; Each test includes the firmware .cpp files it exercises directly, so src/ is not
; built here -- most of it needs the STM32 HAL and would not compile on a PC anyway.
test_build_src = no
build_src_filter = -<*>      ; and nothing from src/ on a plain `pio run` either
build_flags =
    -std=gnu++17
    -I include
    -I test/stubs
    -D RCM_FW_VERSION=\"native-test\"
    -Wall -Wextra -Wno-unused-parameter
